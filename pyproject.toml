[project]
name = "scamshield"
version = "0.1.0"
description = "ScamShield LK: task-job scam detection for Sri Lankan recruitment chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "joblib>=1.4",
    "streamlit>=1.40",
]

[dependency-groups]
embed = ["sentence-transformers>=3.3"]

[tool.uv]
package = false
